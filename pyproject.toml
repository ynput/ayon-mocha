# WARNING: This file is used only for development done on this addon.
# Be aware that dependencies used here might not match the ones used by
# the specific addon bundle set up on the AYON server. This file should
# be used only for local development and CI/CD purposes. To define addon
# dependencies, use pyproject.toml file in the `client` directory.

[project]
name = "ayon-mocha"
version = "1.1.0+dev"
description = "Mocha Pro integration for AYON"
authors = [
    { name = "Ynput Team", email = "team@ynput.io" }
]
license = "Apache-2.0"
readme = "README.md"
# this is for development only
requires-python = ">=3.9.1,<3.10"
dependencies = [
    "appdirs>=1.4.4",
    "semver>=3.0.2",
    "ayon-python-api>=1.0.11",
    "clique>=2.0.0",
    "attrs>=24.3.0",
]

[dependency-groups]
dev = [
    # linting dependencies
    "ruff>=0.17.5",
    "pre-commit>=4.0.0",
    "codespell>=2.2.6",
    "mypy>=1.14.1",
    # test dependencies
    "pytest>=8.0",
    "pytest-print>=1.0",
    "pytest-mock>=3.14.0",
    "mock>=5.1.0",
]
docs = [
    "mkdocs-material>=9.6.7",
    "mkdocs-autoapi>=0.4.0",
    "mkdocstrings-python>=1.16.2",
    "mkdocs-minify-plugin>=0.8.0",
    "markdown-checklist>=0.4.4",
    "mdx-gh-links>=0.4",
    "pymdown-extensions>=10.14.3",
    "mike>=2.1.3",
    "mkdocstrings-shell>=1.0.2",
]
tests = [
    "pytest>=8.0",
    "pytest-print>=1.0",
    "pytest-mock>=3.14.0",
    "mock>=5.1.0",
]

[project.urls]
Homepage = "https://ynput.io"
Repository = "https://github.com/ynput/ayon-mocha"

[tool.uv]
package = false

[tool.codespell]
# Ignore words that are not in the dictionary.
ignore-words-list = "ayon,ynput,parms,parm,hda,developpement"

# Ignore lines that contain this regex. This is hack for missing inline ignore.
# Remove with next codespell release (>2.2.6)
ignore-regex = ".*codespell:ignore.*"

skip = "./.*,./package/*,*/vendor/*,*/unreal/integration/*,*/aftereffects/api/extension/js/libs/*"
count = true
quiet-level = 3

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
addopts = "-ra -q"
testpaths = [
    "tests"
]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/client"
